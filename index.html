<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            color: #333333;
            padding: 30px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            border: 2px solid #b0c4de;
            border-radius: 12px;
            padding: 25px;
        }

        .header {
            margin-bottom: 25px;
        }

        .title-badge {
            background-color: #4a90e2;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .media-card {
            background-color: #f8fafc;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
        }

        .media-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }

        video, img, audio {
            width: 100%;
            border-radius: 6px;
            display: block;
        }

        video {
            background-color: #000000;
        }

        img {
            object-fit: cover;
            height: 180px;
            border: 1px solid #e5e7eb;
        }

        audio {
            height: 40px;
            outline: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="title-badge">Video Clips</div>
        </div>
        <div class="media-grid">
            <div class="media-card">
                <div class="media-title">Japan</div>
                <video controls preload="metadata"><source src="japan.mp4" type="video/mp4"></video>
            </div>
            <div class="media-card">
                <div class="media-title">China</div>
                <video controls preload="metadata"><source src="china.mp4" type="video/mp4"></video>
            </div>
            <div class="media-card">
                <div class="media-title">California</div>
                <video controls preload="metadata"><source src="california.mp4" type="video/mp4"></video>
            </div>
            <div class="media-card">
                <div class="media-title">Indonesia</div>
                <video controls preload="metadata"><source src="indo.mp4" type="video/mp4"></video>
            </div>
            <div class="media-card">
                <div class="media-title">Vietnam</div>
                <video controls preload="metadata"><source src="vietnam.mp4" type="video/mp4"></video>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="header">
            <div class="title-badge">Favourite Photos</div>
        </div>
        <div class="media-grid">
            <div class="media-card">
                <div class="media-title">Photo 1</div>
                <img src="photo1.png" alt="Photo 1">
            </div>
            <div class="media-card">
                <div class="media-title">Photo 2</div>
                <img src="photo2.jpg" alt="Photo 2">
            </div>
            <div class="media-card">
                <div class="media-title">Photo 3</div>
                <img src="photo3.jpg" alt="Photo 3">
            </div>
            <div class="media-card">
                <div class="media-title">Photo 4</div>
                <img src="photo4.jpg" alt="Photo 4">
            </div>
            <div class="media-card">
                <div class="media-title">Photo 5</div>
                <img src="photo5.jpg" alt="Photo 5">
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="header">
            <div class="title-badge">Music List</div>
        </div>
        <div class="media-grid">
            <div class="media-card">
                <div class="media-title">Song 1</div>
                <audio controls><source src="song1.mp3" type="audio/mpeg"></audio>
            </div>
            <div class="media-card">
                <div class="media-title">Song 2</div>
                <audio controls><source src="song2.mp3" type="audio/mpeg"></audio>
            </div>
            <div class="media-card">
                <div class="media-title">Song 3</div>
                <audio controls><source src="song3.mp3" type="audio/mpeg"></audio>
            </div>
            <div class="media-card">
                <div class="media-title">Song 4</div>
                <audio controls><source src="song4.mp3" type="audio/mpeg"></audio>
            </div>
            <div class="media-card">
                <div class="media-title">Song 5</div>
                <audio controls><source src="song5.mp3" type="audio/mpeg"></audio>
            </div>
        </div>
    </div>

</body>
</html>
