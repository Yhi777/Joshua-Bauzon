<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    <style>
        /* Light background na hindi masakit sa mata */
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            color: #333333;
            padding: 30px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            border: 2px solid #b0c4de;
            border-radius: 12px;
            padding: 25px;
        }

        /* Title Header */
        .header {
            margin-bottom: 25px;
        }

        .title-badge {
            background-color: #4a90e2;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Grid Layout para magkatabi sa PC */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Simple Video Card */
        .video-card {
            background-color: #f8fafc;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
        }

        .video-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }

        video {
            width: 100%;
            border-radius: 6px;
            background-color: #000000;
            display: block;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="title-badge">Video Clips</div>
        </div>

        <div class="video-grid">

            <div class="video-card">
                <div class="video-title">Japan</div>
                <video controls preload="metadata">
                    <!-- PALITAN ANG FILE NAME NG VIDEO 1 -->
                    <source src="japan.mp4" type="video/mp4">
                </video>
            </div>

            <div class="video-card">
                <div class="video-title">China</div>
                <video controls preload="metadata">
                    <!-- PALITAN ANG FILE NAME NG VIDEO 2 -->
                    <source src="china.mp4" type="video/mp4">
                </video>
            </div>

            <div class="video-card">
                <div class="video-title">California</div>
                <video controls preload="metadata">
                    <!-- PALITAN ANG FILE NAME NG VIDEO 3 -->
                    <source src="california.mp4" type="video/mp4">
                </video>
            </div>

            <div class="video-card">
                <div class="video-title">Indonesia</div>
                <video controls preload="metadata">
                    <!-- PALITAN ANG FILE NAME NG VIDEO 4 -->
                    <source src="indo.mp4" type="video/mp4">
                </video>
            </div>

            <div class="video-card">
                <div class="video-title">Vietnam</div>
                <video controls preload="metadata">
                    <!-- PALITAN ANG FILE NAME NG VIDEO 5 -->
                    <source src="vietnam.mp4" type="video/mp4">
                </video>
            </div>

        </div>
    </div>

</body>
</html>
